name: Studio checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r api/requirements.lock
      - run: python -m pytest api/tests -q
      - run: npm ci
      - run: npm test
      - run: node --check dist/project-format.js && node --check dist/assembly-data.js && node --check dist/studio-quality.js && node --check dist/studio-tools.js && node --check dist/studio-3d.js && node --check dist/server-mode.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
